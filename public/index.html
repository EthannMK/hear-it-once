<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caller Simulator — Hear It Once</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500;1,6..72,600&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="chrome"></div>
<main class="sim">
  <aside class="panel scenarios" aria-labelledby="sc-h">
    <header><h2 id="sc-h">Demo scenarios</h2></header>
    <ul class="scenario-list" id="scenarios"></ul>
    <div id="scenario-detail"></div>
  </aside>
  <section class="panel call" aria-labelledby="call-h">
    <header class="call-head"><h2 id="call-h" class="who">Call</h2><span id="call-status"></span><span class="grow"></span><span id="call-id" class="small muted num"></span></header>
    <div id="call-body"></div>
  </section>
  <aside class="panel behind" aria-labelledby="bh-h">
    <header><h2 id="bh-h">Behind the call</h2></header>
    <div id="behind"><div class="section empty">Start a call to see verification, system lookups, actions and the case as they happen.</div></div>
  </aside>
</main>
<div id="sr-live" class="sr-only" aria-live="polite"></div>
<script type="module" src="/js/simulator.js"></script>
</body>
</html>
