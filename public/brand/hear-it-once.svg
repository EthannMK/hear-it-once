<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hear It Once">
  <!--
    The product mark: an ear, with the numeral one standing in it. Hear it once — the ear is the
    listening, the one is how many times you should have to say it.

    Three shapes, in the order they are read. The violet helix is the rim of the ear, open at the
    bottom right where the lobe falls away. The indigo leaf is the hollow inside it. The numeral
    stands in front of both and carries a full base bar, because without one a vertical stroke at
    24px reads as a tally mark rather than a one.

    All paths, no text element: it renders the same with no fonts installed and survives being
    exported into a slide. Tuned at 24px first — the header is where it is seen most.
  -->
  <g fill="none" stroke="#5846c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 15 C 38 7, 24 6, 16 14 C 8 22, 9 33, 14 39 C 18 44, 21 47, 22 52 C 23 57, 28 59, 32 56" />
  </g>
  <!-- The hollow of the ear, set left of the numeral so the two never merge into one dark mass. -->
  <path d="M28 17 C 21 20, 19 28, 22 35 C 24 40, 29 39, 29.5 33 C 30 26, 30.5 19, 28 17 Z" fill="#3b2fa8"/>
  <g fill="none" stroke="#14121f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 25 L39.5 20 L39.5 49" />
    <path d="M32 49 L47 49" />
  </g>
</svg>
